{% extends 'blog/base.html' %}
{% block content %}
    <div>
        <h3 class="blog_title">{{ post.title }}</h3>
        <p class="blog_time">Created: <time>{{ post.created_date }}</time></p>
        <p class="blog_time">Last update: <time>{{ post.last_updated_date }}</time></p>
        <p class="blog_para">{{ post.text|safe|urlize }}</p>
    </div>
{% endblock %}
