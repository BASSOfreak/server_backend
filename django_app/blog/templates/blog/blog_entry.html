{% extends 'blog/base.html' %}
{% block content %}
    <div class="blog_entry_header">
        <h1 class="blog_title">{{ post.title }}</h3>
        <p class="blog_time">Created: <time>{{ post.created_date }}</time></p>
        <p class="blog_time">Last update: <time>{{ post.last_updated_date }}</time></p>
    </div>
    <div class="blog_entry_text">
        {% autoescape off %}
        {% load markdown_filter %}
            {{ post.text|markdownify }}
        {% endautoescape %}
    </div>
{% endblock %}
