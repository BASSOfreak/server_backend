{% extends 'blog/base.html' %}
{% block content %}
    <div>
        <h3>Existing Entries</h3>
        {%for post in posts%}
            <article>
                <h4><a href="{% url 'blog_entry' pk=post.pk %}">{{post.title}}</a></h4>
                <p>{{post.created_date}}</p>
            </article>
        {%endfor%}
    </div>
{% endblock %}
