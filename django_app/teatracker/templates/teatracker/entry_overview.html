{% extends 'teatracker/base.html' %}
{% block content %}
    <div>
        <h3>Existing Entries</h3>
        {%for entry in entries%}
            <div>
                <p>
                    visited location: {{entry.location.name}}<br>
                    on: {{entry.created_date}}<br>
                    consumed items:
                    <ul>
                        {%for item in entry.items.all%}
                        <li>{{item.name}}</li>
                        {%endfor%}
                    </ul>
                </p>
            </div>
        {%endfor%}
    </div>
{% endblock %}
